loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 1
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

deploymentMode: SimpleScalable

backend:
  replicas: 2
read:
  replicas: 2
write:
  replicas: 3

minio:
  enabled: true

gateway:
  service:
    type: LoadBalancer # On a local machine (minikube/kind), this might stay <pending>