serverFiles:
  alerting_rules.yml:
    groups:
      - name: StudentProjectAlerts
        rules:
          - alert: KubernetesPodCrashLooping
            expr: kube_pod_container_status_restarts_total > 5
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Team Name: group3 - Pod {{ $labels.pod }} has restarted more than 5 times."